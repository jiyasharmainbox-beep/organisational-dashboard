<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Dashboard</h1>

    <section class="card">
    <h2>Add a task</h2>
    <form id="task-form">
        <input type="text" id="task-name" placeholder="Task name (e.g. Essay draft)" required>
        <input type="text" id="task-subject" placeholder="Subject (e.g. English)" required>
        <select id="task-type">
        <option value="Assessment">Assessment</option>
        <option value="Exam">Exam</option>
        <option value="Homework">Homework</option>
        </select>
        <input type="date" id="task-date" required>
        <button type="submit">Add task</button>
    </form>
    </section>

    <section class="card">
    <h2>Coming up</h2>
    <ul id="task-list"></ul>
    </section>

    <script src="script.js"></script>
</body>
</html>
